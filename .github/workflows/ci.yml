name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  vendored:
    name: Build against the vendored C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev pipewire

      - name: Build
        run: cargo build --workspace --all-targets --features vendored

      - name: Test
        run: cargo test --workspace --features vendored

  system:
    name: Build against an installed C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev pipewire

      - name: Install tinypipewire
        run: |
          meson setup build vendor/tinypipewire \
            -Dexamples=false -Dtests=false -Dutils=false --prefix=/usr
          sudo meson install -C build
          sudo ldconfig

      - name: Test
        run: cargo test --workspace

  smoke:
    name: Headless smoke test against a running daemon
    runs-on: ubuntu-latest
    env:
      XDG_RUNTIME_DIR: /tmp/pipewire-smoke-runtime
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev pipewire

      - name: Install tinypipewire
        run: |
          meson setup build vendor/tinypipewire \
            -Dexamples=false -Dtests=false -Dutils=false --prefix=/usr
          sudo meson install -C build
          sudo ldconfig

      - name: Start a headless PipeWire daemon
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          pipewire > /tmp/pipewire-smoke.log 2>&1 &
          disown
          for _ in $(seq 1 20); do
            [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] && exit 0
            sleep 0.5
          done
          echo "pipewire did not start:" >&2
          cat /tmp/pipewire-smoke.log >&2
          exit 1

      # list_targets connects a real capture stream and enumerates
      # targets. There is no audio/video hardware here, so the list
      # comes back empty, but running it proves the FFI actually
      # talks to a live daemon rather than only linking against it.
      - name: Run an example against the live daemon
        run: cargo run -p tinypipewire --example list_targets

  bindings:
    name: Check the committed bindings against the pinned headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # Reading the submodule's headers keeps this independent of where any
      # library happens to be installed, and needs no PipeWire to link against.
      - name: Regenerate and compare
        env:
          TINYPIPEWIRE_SYS_HEADERS_ONLY: "1"
          TINYPIPEWIRE_SYS_UPDATE_BINDINGS: "1"
        run: |
          cargo build -p tinypipewire-sys
          git diff --exit-code -- tinypipewire-sys/src/bindings/pregenerated.rs

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features vendored -- -D warnings

  no-libclang:
    name: Build from the committed bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Build with bindgen turned off
        run: cargo build -p tinypipewire --no-default-features --features vendored
