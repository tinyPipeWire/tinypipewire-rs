name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  vendored:
    name: Build against the vendored C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev pipewire

      - name: Build
        run: cargo build --workspace --all-targets --features vendored

      - name: Test
        run: cargo test --workspace --features vendored

  system:
    name: Build against an installed C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev pipewire

      - name: Install tinypipewire
        run: |
          meson setup build tinypipewire-sys/vendor/tinypipewire \
            -Dexamples=false -Dtests=false -Dutils=false --prefix=/usr
          sudo meson install -C build
          sudo ldconfig

      - name: Test
        run: cargo test --workspace

  smoke:
    name: Headless smoke test against a running daemon
    runs-on: ubuntu-latest
    env:
      XDG_RUNTIME_DIR: /tmp/pipewire-smoke-runtime
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev pipewire wireplumber

      - name: Install tinypipewire
        run: |
          meson setup build tinypipewire-sys/vendor/tinypipewire \
            -Dexamples=false -Dtests=false -Dutils=false --prefix=/usr
          sudo meson install -C build
          sudo ldconfig

      # Both daemons look for a session bus, and wireplumber quits without
      # one; a runner has none until it is asked for.
      - name: Start a session bus
        run: |
          echo "DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --fork --print-address)" \
            >> "$GITHUB_ENV"

      - name: Start a headless PipeWire daemon
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pipewire > /tmp/pipewire-smoke.log 2>&1 &
          disown
          for _ in $(seq 1 20); do
            [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] && exit 0
            sleep 0.5
          done
          echo "pipewire did not start:" >&2
          cat /tmp/pipewire-smoke.log >&2
          exit 1

      # A null sink gives the graph a stereo Audio/Sink node with a clock,
      # so a playback stream has something to link to and real cycles to be
      # driven by. Without it the runner has no audio node at all.
      - name: Create a null sink
        run: |
          pw-cli create-node adapter '{
            factory.name  = support.null-audio-sink
            node.name     = tpw-smoke-sink
            media.class   = Audio/Sink
            object.linger = true
            audio.position = [ FL FR ]
          }'
          for _ in $(seq 1 20); do
            pw-cli ls Node | grep -q tpw-smoke-sink && exit 0
            sleep 0.5
          done
          echo "the null sink never appeared in the graph:" >&2
          pw-cli ls Node >&2
          exit 1

      # Autoconnect is what wires a stream to its target, and only a session
      # manager does that wiring.
      - name: Start the session manager
        run: |
          wireplumber > /tmp/wireplumber-smoke.log 2>&1 &
          wp_pid=$!
          disown
          for _ in $(seq 1 20); do
            # wpctl talks to wireplumber itself, so this fails while it is
            # absent — unlike looking for a node the daemon already had.
            if kill -0 "$wp_pid" 2>/dev/null && wpctl status > /dev/null 2>&1; then
              exit 0
            fi
            sleep 0.5
          done
          echo "wireplumber is not managing the graph:" >&2
          cat /tmp/wireplumber-smoke.log >&2
          exit 1

      # These are #[ignore]d so every other job can run the suite with no
      # daemon; here they assert the callbacks actually fire.
      - name: Run the smoke tests
        run: cargo test -p tinypipewire --test smoke -- --ignored --test-threads=1

      - name: Show the daemon logs on failure
        if: failure()
        run: |
          echo "== pipewire =="; cat /tmp/pipewire-smoke.log
          echo "== wireplumber =="; cat /tmp/wireplumber-smoke.log 2>/dev/null
          echo "== graph =="; pw-cli ls Node 2>/dev/null || true
          echo "== session =="; wpctl status 2>/dev/null || echo "wpctl could not connect"

  bindings:
    name: Check the committed bindings against the pinned headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # Reading the submodule's headers keeps this independent of where any
      # library happens to be installed, and needs no PipeWire to link against.
      - name: Regenerate and compare
        env:
          TINYPIPEWIRE_SYS_HEADERS_ONLY: "1"
          TINYPIPEWIRE_SYS_UPDATE_BINDINGS: "1"
        run: |
          cargo build -p tinypipewire-sys
          git diff --exit-code -- tinypipewire-sys/src/bindings/pregenerated.rs

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features vendored -- -D warnings

  no-libclang:
    name: Build from the committed bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Build with bindgen turned off
        run: cargo build -p tinypipewire --no-default-features --features vendored

  package:
    name: Verify the published package builds on its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev

      # cargo package unpacks the crate it just built and compiles that copy,
      # so this fails if the vendored C sources do not ship inside it.
      - name: Package and build the extracted crate
        run: cargo package -p tinypipewire-sys --features vendored

