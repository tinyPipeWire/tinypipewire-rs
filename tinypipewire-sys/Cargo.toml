[package]
name = "tinypipewire-sys"
description = "Raw FFI bindings to tinypipewire, a small C wrapper around PipeWire's pw_stream"
categories = ["external-ffi-bindings", "multimedia"]
keywords = ["pipewire", "audio", "video", "ffi", "bindings"]
links = "tinypipewire"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["bindgen"]
# Generate bindings from the installed headers instead of using the committed ones.
bindgen = ["dep:bindgen"]
# Build the pinned C sources under vendor/ with meson instead of probing pkg-config.
vendored = []

[build-dependencies]
bindgen = { version = "0.71", optional = true }
pkg-config = "0.3"

[package.metadata.docs.rs]
default-features = false
targets = ["x86_64-unknown-linux-gnu"]
