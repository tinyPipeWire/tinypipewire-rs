[package]
name = "tinypipewire-sys"
description = "Raw FFI bindings to tinypipewire, a small C wrapper around PipeWire's pw_stream"
readme = "README.md"
categories = ["external-ffi-bindings", "multimedia"]
keywords = ["pipewire", "audio", "video", "ffi", "bindings"]
links = "tinypipewire"
build = "build.rs"
# Own semver for the crate; the build metadata names the C release it binds.
version = "0.1.0+tpw0.9.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["bindgen"]
# Generate bindings from the installed headers instead of using the committed ones.
bindgen = ["dep:bindgen"]
# Build the pinned C sources shipped under vendor/ instead of probing pkg-config.
vendored = []

[build-dependencies]
bindgen = { version = "0.73", optional = true }
pkg-config = "0.3"

[package.metadata.docs.rs]
default-features = false
targets = ["x86_64-unknown-linux-gnu"]
